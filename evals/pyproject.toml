[project]
name = "flow-evals"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16.0",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
